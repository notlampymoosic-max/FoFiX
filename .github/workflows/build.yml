name: Build FoFiX Binaries (Mac & PC)

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller sng-parser

      - name: Build with PyInstaller
        run: |
          pyinstaller FoFiX.spec --noconfirm

      - name: Copy data directory to dist
        run: |
          robocopy data dist\FoFiX\data /E /XD songs /XF *.sng *.pyc /NFL /NDL /NJH /NJS || exit 0

      - name: Archive Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/FoFiX/* -DestinationPath FoFiX-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoFiX-Windows-x64
          path: FoFiX-Windows-x64.zip

  build-macos:
    name: Build macOS Application (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller sng-parser

      - name: Build with PyInstaller
        run: |
          pyinstaller FoFiX.spec --noconfirm

      - name: Archive macOS Application
        run: |
          cd dist
          zip -r -q -y ../FoFiX-macOS-Universal.zip FoFiX.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoFiX-macOS-Universal
          path: FoFiX-macOS-Universal.zip

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: FoFiX-Windows-x64

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: FoFiX-macOS-Universal

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FoFiX-Windows-x64.zip
            FoFiX-macOS-Universal.zip
          draft: false
          prerelease: false
